aid: point-me
name: POINT.ME
description: 'point.me is an award-travel company that operates a real-time award flight search engine
  for consumers and, through point.me Gateway, an API-first embedded loyalty-travel platform that banks
  and loyalty programs run inside their own branded apps. The consumer product searches award availability
  across 150+ airline and hotel loyalty programs on Basic/Standard/Premium annual subscriptions, and adds
  paid concierge booking. Gateway sells award search, point transfers and booking as an embedded integration
  to financial institutions (Amex among its named partners) and to loyalty programs. The API host api.point.me
  is live and identifies itself as "Flight Search APIs", but every path on it answers 401 with WWW-Authenticate:
  Bearer, and Gateway is sold through a demo form rather than a public developer portal, so no machine-readable
  contract is published.'
