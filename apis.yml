    probed (/openapi.json, /swagger.json, /docs, /redoc, /graphql, /mcp, /.well-known/*) returns HTTP
    401 with WWW-Authenticate: Bearer. point.me publishes no developer portal or reference for it — the
    Gateway page describes the integration as API-first and routes prospects to a demo form.'
