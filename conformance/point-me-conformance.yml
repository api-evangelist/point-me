      source: https://www.point.me/partnerships/financial-institutions/
  trust_center: null
  vulnerability_disclosure: false
  vulnerability_disclosure_evidence: >-
    /.well-known/security.txt returns 404 on www.point.me and connect.point.me, 401
    on api.point.me, 404 on auth.point.me. No bug bounty or disclosure page found.

