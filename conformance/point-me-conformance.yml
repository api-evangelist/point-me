      status: claimed
      quote: >-
        "Enterprise-Grade Security. SOC 2 compliant. Configurable branding. SSO
        integration. Performance dashboards." and, in the Gateway FAQ, "Gateway is
        SOC2 certified and designed for issuer-grade security requirements."
      source: https://www.point.me/partnerships/financial-institutions/
