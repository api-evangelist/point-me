    note: >-
      Auth0-hosted identity tenant (issuer https://auth.point.me/). This is the only
      point.me host serving any /.well-known document.
    documents:
      - path: /.well-known/openid-configuration
        status: 200
        content_type: application/json
        file: point-me-openid-configuration.json
      - path: /.well-known/oauth-authorization-server
        status: 200
        content_type: application/json
        file: point-me-oauth-authorization-server.json
