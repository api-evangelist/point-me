description: >-
  /.well-known probe of the point.me hosts. The single real hit is the Auth0-hosted
  identity tenant at auth.point.me, which serves a complete OpenID Connect discovery
  document, the identical RFC 8414 OAuth authorization-server metadata, and a JWKS.
hosts:
